[mod]
prefix = "MnT_"

[game]
root = "unused"
mount_roots = ["clausewitz", "jomini", "game"]

[bom]
default = "ignore"

# `mnt_` is deliberately NOT declared here. That makes an all-lowercase `mnt_` name a
# NEAR_MISS of `MnT_`, which is the state this fixture exists to pin down: it must stay
# silent inside a lowercase-forced directory and still fire outside one.
[naming]
subsystem_prefixes = []

[severity]
EU5050 = "off"
