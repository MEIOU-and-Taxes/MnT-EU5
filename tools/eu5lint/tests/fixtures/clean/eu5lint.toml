[mod]
prefix = "MnT_"

[game]
root = "unused"
mount_roots = ["clausewitz", "jomini", "game"]

[bom]
default = "ignore"
rules = [
  { glob = "main_menu/setup/start/**/*.txt", policy = "forbidden" },
  { glob = "**/localization/**/*.yml", policy = "required" },
  { glob = "in_game/common/**/*.txt", policy = "required" },
]
