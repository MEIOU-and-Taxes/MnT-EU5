[mod]
prefix = "MnT_"

[game]
root = "unused"
mount_roots = ["clausewitz", "jomini", "game"]

[bom]
default = "ignore"
rules = [
  { glob = "in_game/common/**/*.txt", policy = "required" },
]

[naming]
subsystem_prefixes = ["mnt_", "RGO_"]

[[naming_exception]]
path = "in_game/common/loose/gone.txt"
reason = "fixture: names a file that is not here"

[[naming_exception]]
path = "in_game/common/loose/MnT_here.txt"
reason = ""
