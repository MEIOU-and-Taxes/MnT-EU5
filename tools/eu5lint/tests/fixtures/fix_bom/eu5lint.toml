[mod]
prefix = "MnT_"

[game]
root = "unused"
mount_roots = ["clausewitz", "jomini", "game"]

# One directory per policy, so fix-bom's whole decision table is covered:
# it must add, must remove, and must leave the advisory and default cases alone.
[bom]
default = "ignore"
rules = [
  { glob = "in_game/common/**/*.txt",             policy = "required" },
  { glob = "main_menu/setup/start/**/*.txt",      policy = "forbidden" },
  { glob = "main_menu/setup/templates/**/*.txt",  policy = "warn_required" },
]

[severity]
EU5050 = "off"
