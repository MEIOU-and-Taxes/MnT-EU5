[mod]
prefix = "MnT_"

[game]
root = "unused"
mount_roots = ["clausewitz", "jomini", "game"]

[bom]
default = "ignore"
rules = [
  { glob = "in_game/common/**/*.txt", policy = "required" },
]

[naming]
subsystem_prefixes = ["mnt_", "RGO_"]

[[naming_exception]]
path = "in_game/common/upstream/MnT_layer.txt"
reason = "fixture: upstream ships this exact prefixed path and the override is intended"

# This fixture exercises a naming rule; EU5030 is the overwrite check.
[severity]
EU5030 = "off"
