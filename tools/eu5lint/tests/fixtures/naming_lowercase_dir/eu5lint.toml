[mod]
prefix = "MnT_"

[game]
root = "unused"
mount_roots = ["clausewitz", "jomini", "game"]

[bom]
default = "ignore"
rules = [
  { glob = "in_game/common/**/*.txt", policy = "required" },
]

[naming]
subsystem_prefixes = ["mnt_", "RGO_"]

# EU5050 is this repository's stricter single-prefix rule and would fire on every
# name here that is not exactly mod.prefix. A mod running M&T's multi-prefix scheme
# turns it off and relies on [naming] instead, which is what this fixture models.
[severity]
EU5050 = "off"
