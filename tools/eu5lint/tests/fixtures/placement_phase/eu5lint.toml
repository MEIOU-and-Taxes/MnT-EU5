[mod]
prefix = "MnT_"

[game]
root = "unused"
mount_roots = ["clausewitz", "jomini", "game"]

[bom]
default = "ignore"

[naming]
manifest = "vanilla_manifest_placement.txt"

[severity]
EU5050 = "off"
EU5081 = "off"

# Misplaced by the rule's own reading, and deliberately so. The message tells
# readers to record an exception; this proves the exception is honoured.
[[naming_exception]]
path = "loading_screen/common/advances/MnT_deliberate.txt"
reason = "placed here on purpose for the test that exceptions suppress EU5090"
