[mod]
prefix = "MnT_"

[game]
root = "unused"
mount_roots = ["clausewitz", "jomini", "game"]

[bom]
default = "ignore"
rules = [
  { glob = "in_game/common/**/*.txt", policy = "required" },
]

# The staleness half of EU5052 is a whole-tree claim: a narrow file set cannot
# show that this path names nothing. The reason is deliberately real so only
# the staleness half of the rule is under test.
[[prefix_exception]]
path = "in_game/common/aaa_gone.txt"
reason = "fixture: names a file that is not here"
