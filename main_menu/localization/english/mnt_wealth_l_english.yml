l_english:
 # ── CORE CONCEPTS ──
 # Ordered the way gold moves: output becomes wages, wages become local
 # wealth, local wealth is spent on investment, investment sets the level.
 game_concept_mnt_wealth_gdp: "GDP"
 game_concept_mnt_wealth_gdp_desc: "This is the sum value of all goods produced in this location per month."
 game_concept_mnt_wealth_cached_gdp: "GDP at Last Survey"
 game_concept_mnt_wealth_cached_gdp_desc: "This is the sum value of all goods produced in this location at the time it was last surveyed. Surveys happen on a 5 year window for performance improvement."
 game_concept_mnt_wealth_wages: "Wage Rate"
 game_concept_mnt_wealth_wages_desc: "The share of [mnt_wealth_gdp|E] a location pays into the wage pool every month. Peasant, tribal, and slave pops lower the rate by their share of the population; [mnt_wealth_local_investment|E] raises it. The location loses [production_efficiency|E] equal to the wage rate. The wage pool splits between [estates|E] by local [estate_power|E], and every estate's share is paid straight into [mnt_wealth_local_wealth|E]. Gold moves between the estate treasuries and local wealth separately, through [mnt_wealth_national_estate_investments|E]."
 game_concept_mnt_wealth_local_wealth: "Local Wealth"
 game_concept_mnt_wealth_local_wealth_desc: "The gold held by a location's people. Each [estate|E] owns a share, and that share drifts yearly toward the estate's local [estate_power|E]. Every month gold is invested at the [mnt_wealth_investment_rate|E] and [mnt_wealth_expected_wealth|E] is paid as each estate's invested wealth decays, with the net applied as [mnt_wealth_investment_progress|E]. Local Wealth can be looted by occupiers."
 game_concept_mnt_wealth_expected_wealth: "Investment Upkeep"
 game_concept_mnt_wealth_expected_wealth_desc: "The gold an [estate|E] pays each month to hold its [mnt_wealth_local_investment|E] in a location. It is the estate's invested wealth times its monthly decay rate, a per-estate rate set by local and national modifiers. Investment settles at the level where the estate's monthly investment spending exactly covers this upkeep, so a higher decay rate settles it lower and a lower rate settles it higher."
 game_concept_mnt_wealth_investment_rate: "Investment Rate"
 game_concept_mnt_wealth_investment_rate_desc: "The share of [mnt_wealth_local_wealth|E] an [estate|E] invests every month. This same rate sets the base for upkeep, so a higher rate both invests more and costs more upkeep."
 game_concept_mnt_wealth_investment_spending: "Investment Spending"
 game_concept_mnt_wealth_investment_spending_desc: "The gold an [estate|E] moves out of [mnt_wealth_local_wealth|E] and into [mnt_wealth_invested_wealth|E] each month: its share of the local pool, spent at the [mnt_wealth_investment_rate|E]. This is a flow, not a store. What it leaves behind after upkeep is [mnt_wealth_investment_progress|E]."
 game_concept_mnt_wealth_investment_progress: "Investment Progress"
 game_concept_mnt_wealth_investment_progress_desc: "What an [estate|E] has to show for a month in a location: its [mnt_wealth_investment_spending|E] less the upkeep owed on its current level. Spending is scaled by Investment Efficiency and upkeep by Upkeep Efficiency, so the two sides can be moved apart. Progress accumulates into [mnt_wealth_invested_wealth|E], and the [mnt_wealth_local_investment|E] level is read from that total against a fixed cost base, so the level does not jump when Desired Wealth changes. A month whose upkeep outweighs its spending gives negative progress and eats into the accumulated total."
 game_concept_mnt_wealth_invested_wealth: "Invested Wealth"
 game_concept_mnt_wealth_invested_wealth_desc: "Everything an [estate|E] has put into a location and not lost again, held as one running total per estate. [mnt_wealth_investment_spending|E] adds to it, upkeep and [mnt_wealth_asset_seizure|E] take from it, and looting can tear a hole in it. The [mnt_wealth_local_investment|E] level is read from this total against a fixed cost base, where whole level N needs N ^ 2 times that base, so each level costs more than the one before. A total below zero is neglect and reads on the same scale."
 game_concept_mnt_wealth_local_investment: "Local Investment"
 game_concept_mnt_wealth_local_investment_desc: "How built up a location is, tracked per [estate|E]. Every month local wealth is invested at the [mnt_wealth_investment_rate|E] and [mnt_wealth_expected_wealth|E] is paid as the estate's invested wealth decays; the net is [mnt_wealth_investment_progress|E]. The level is set yearly from the invested pool measured against a fixed cost base: whole level N needs N ^ 2 times that base, so each level costs more gold than the one before. Neglect levels use the same costs on unpaid upkeep. Positive levels apply positive modifiers to the location for that estate, and negative levels are neglect and apply negative modifiers."
 game_concept_mnt_wealth_national_estate_investments: "National Estate Investments"
 game_concept_mnt_wealth_national_estate_investments_desc: "The monthly flow of gold between an [estate|E]'s treasury and its locations, set by how its treasury compares to its savings goal. Above the goal, one twelfth of the surplus is paid into [mnt_wealth_local_wealth|E] each month, spread across locations by each location's share of the estate's power. Below the goal, the flow reverses into [mnt_wealth_asset_seizure|E]. Each month's flow is capped at a fixed share of the goal."
 game_concept_mnt_wealth_asset_seizure: "Asset Seizure"
 game_concept_mnt_wealth_asset_seizure_desc: "When an [estate|E]'s treasury falls below its savings goal, it covers the shortfall by taking gold out of its locations. It seizes liquid [mnt_wealth_local_wealth|E] first, then rips gold out of its invested wealth, which lowers its [mnt_wealth_local_investment|E] toward neglect. Invested wealth refills only through slow monthly investment, so a seizure sets a location back for years. Seizing stops once the treasury climbs back to its goal."

