l_english:
 STATIC_MODIFIER_NAME_mnt_credit_interest_market_price: "Credit-Market Loan Interest"
 STATIC_MODIFIER_DESC_mnt_credit_interest_market_price: "$mnt_credit_interest_intro$"
 STATIC_MODIFIER_NAME_mnt_debt_sustainability_interest: "Debt Sustainability"
 STATIC_MODIFIER_DESC_mnt_debt_sustainability_interest: "Loan interest rises slightly when outstanding debt is high compared to yearly income."
 AUTO_MODIFIER_NAME_MnT_credit_output_from_inflation: "Credit output from inflation"
 mnt_credit_interest_intro: "Supply and demand for [ShowGoodsName('credit')] in your capital market determine the lending quote. Scarce Credit raises loan interest; plentiful Credit lowers it. The goods price below adjusts more slowly."
 mnt_credit_interest_market_title: "[GetPlayer.GetCapital.GetMarket.GetName]"
 mnt_credit_interest_balance: "Balance"
 mnt_credit_interest_supply: "Supply"
 mnt_credit_interest_demand: "Live demand"
 mnt_credit_interest_price: "Goods price"
 mnt_credit_interest_formula: "#T Current lending quote#!\n#v [GetPlayer.MakeScope.ScriptValue('mnt_credit_lending_quote')|3]#!@gold! per Credit\n(Credit demand + 1) ÷ (Credit supply + 1)\n\n#T Effect on loan interest#!\n(Lending quote − 1) × 7.5\n([GetPlayer.MakeScope.ScriptValue('mnt_credit_lending_quote')|3] − 1) × 7.5 = #v [Multiply_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.ScriptValue('mnt_credit_lending_quote'), '(CFixedPoint)1'), '(CFixedPoint)7.5')|2]#! percentage points.\n\nThe borrowing quote updates immediately after loan changes. Click the market name to inspect its goods and trade."
