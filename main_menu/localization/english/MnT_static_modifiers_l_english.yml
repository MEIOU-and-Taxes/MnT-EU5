l_english:
 STATIC_MODIFIER_NAME_mnt_credit_interest_market_price: "Credit-Price Loan Interest"
 STATIC_MODIFIER_DESC_mnt_credit_interest_market_price: "$mnt_credit_interest_intro$"
 STATIC_MODIFIER_NAME_mnt_debt_sustainability_interest: "Debt Sustainability"
 STATIC_MODIFIER_DESC_mnt_debt_sustainability_interest: "Loan interest rises slightly when outstanding debt is high compared to yearly income."
 AUTO_MODIFIER_NAME_MnT_credit_output_from_inflation: "Credit output from inflation"
 mnt_credit_interest_intro: "The price of [ShowGoodsName('credit')] in your capital market affects loan interest. Expensive Credit raises interest; cheaper Credit lowers it."
 mnt_credit_interest_market_title: "[GetPlayer.GetCapital.GetMarket.GetName]"
 mnt_credit_interest_balance: "Balance"
 mnt_credit_interest_supply: "Supply"
 mnt_credit_interest_demand: "Demand"
 mnt_credit_interest_price: "Price"
 mnt_credit_interest_formula: "#T Effect on loan interest#!\n(Credit price − 1) × 7.5\n([GetPlayer.GetCapital.GetMarket.MakeScope.ScriptValue('mnt_credit_tooltip_market_price')|3] − 1) × 7.5 = #v [Multiply_CFixedPoint(Subtract_CFixedPoint(GetPlayer.GetCapital.GetMarket.MakeScope.ScriptValue('mnt_credit_tooltip_market_price'), '(CFixedPoint)1'), '(CFixedPoint)7.5')|2]#! percentage points.\n\nThis price adjustment is refreshed each month and after loan changes. Click the market name to inspect its goods and trade."
