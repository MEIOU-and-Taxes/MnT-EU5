l_english:
 STATIC_MODIFIER_NAME_mnt_credit_interest_market_price: "Credit-Market Loan Interest"
 STATIC_MODIFIER_DESC_mnt_credit_interest_market_price: "$mnt_credit_interest_intro$"
 STATIC_MODIFIER_NAME_mnt_credit_merchant_capacity: "Merchant Credit"
 STATIC_MODIFIER_NAME_mnt_credit_burgher_trade_capacity: "Burgher Trade Credit"
 STATIC_MODIFIER_DESC_mnt_credit_burgher_trade_capacity: "The local price of [ShowGoodsName('credit')] adjusts [burgher_trade|e] capacity. The effect is neutral at 1 ducat and ranges from +300% at the lowest price to −70% at the highest.\n\nThe location breakdown expresses this adjustment in percentage points added to or subtracted from the full trade multiplier, including the base 100% and other bonuses. A displayed −90% changes a 750% multiplier to 660%, which leaves the location with 12% less Burgher Trade Capacity."
 STATIC_MODIFIER_NAME_mnt_debt_sustainability_interest: "Debt Sustainability"
 STATIC_MODIFIER_DESC_mnt_debt_sustainability_interest: "Loan interest rises slightly when outstanding debt is high compared to yearly income."
 AUTO_MODIFIER_NAME_mnt_credit_output_from_enfranchisement: "Credit output from peasant enfranchisement"
 AUTO_MODIFIER_NAME_MnT_credit_output_from_inflation: "Credit output from inflation"
 mnt_credit_interest_intro: "Supply and demand for [ShowGoodsName('credit')] in your capital market determine loan interest. The figures below are the inputs used at the last interest update. The goods price is shown separately and can change between updates."
 mnt_credit_interest_market_title: "[GetPlayer.GetCapital.GetMarket.GetName]"
 mnt_credit_interest_balance: "Balance"
 mnt_credit_interest_supply: "Supply used"
 mnt_credit_interest_demand: "Demand used"
 mnt_credit_interest_price: "Goods price"
 mnt_credit_interest_formula: "#T Lending quote used#!\n#v [GetPlayer.MakeScope.ScriptValue('mnt_credit_lending_quote')|3]#!\n(Demand used + 1) ÷ (Supply used + 1)\n\n#T Effect on loan interest#!\nAbove a quote of 1: 40 × (quote − 1) ÷ (quote + 14).\nAt or below 1: (quote − 1) × 9.\nCalculated adjustment: #v [Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('mnt_credit_market_interest_adjustment'), '(CFixedPoint)100')|2]#! percentage points.\n\nWith a 10% base rate, a quote of 2 gives 12.5%, approaching 50% at extreme scarcity. Other interest modifiers apply separately.\nInterest refreshes after the monthly market update and immediately after player loan changes. Click the market name to inspect current goods and trade."
