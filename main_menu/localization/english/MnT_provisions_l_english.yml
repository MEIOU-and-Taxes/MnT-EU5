 MODIFIER_TYPE_DESC_ban_imports_of_provisions: "This blocks the [import|e] of [ShowGoodsName('provisions')] to all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_can_extract_provisions: "Can Extract $provisions$"
