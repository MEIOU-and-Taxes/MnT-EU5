l_english:
 provisions: "Provisions"
 provisions_desc: "Foodstuffs prepared for storage and consumption: salted meat, milled flour, cured fish, and dried staples. Raw harvests sustain those who grow them, while provisions are what feeds households that grow nothing at all."

