l_english:
 mnt_offices.1.title:0 "The Office Without Its Industry"
 mnt_offices.1.desc:0 "For as long as the registers go back, [ROOT.GetName] has been counted among the [ROOT.GetOwner.GetAdjective] centres of production. The Office of Manufactories grew around that certainty: its inspectors fixed the standards, its clerks kept the books, and its friends at court grew fat on the trade.\n\nThe city's crafts have been long in decline. Its neighbours have moved ahead, their workshops busier and their merchants richer, and some voices at court now ask why the state should keep supporting an institution whose trade has slipped away.\n\nIts patrons do not intend to let it die. They ask for a substantial subvention — enough to keep the inspectors in paper, books and furniture until the city recovers its place. Should the state refuse, the office will be dissolved and its clerks sent home."
 mnt_offices.1.a:0 "Pay the subvention."
 mnt_offices.1.b:0 "Let the office dissolve."
