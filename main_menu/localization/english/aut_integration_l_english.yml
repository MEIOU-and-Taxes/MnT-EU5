l_english:
 ### Colour-coded breakdown rows for the integration tooltip in replace/aut_l_english.yml.
 ### These are this mod's own strings: no base-game key of these names exists.
 location_integration_gain_base_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_base').GetValue|2W]% Base#!"
 location_integration_gain_base_yellow: "#Y [Location.MakeScope.GetVariable('location_integration_gain_base').GetValue|2W]% Base#!"
 location_integration_gain_base_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_base').GetValue|2W]% Base#!"
 location_integration_gain_proximity_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_proximity').GetValue|2W]x Proximity#! (Max 1.1x)"
 location_integration_gain_proximity_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_proximity').GetValue|2W]x Proximity#! (Min 0.85x)"
 location_integration_gain_culture_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_culture').GetValue|2W]x Cultural Opinion#! (Max 1.15x)"
 location_integration_gain_culture_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_culture').GetValue|2W]x Cultural Opinion#! (Min 0.85x)"
 location_integration_gain_religion_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_religion').GetValue|2W]x Religious Tolerance#! (Max 1.25x)"
 location_integration_gain_religion_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_religion').GetValue|2W]x Religious Tolerance#! (Min 0.75x)"
 location_integration_gain_modifiers_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_modifiers').GetValue|2W]x Modifiers#! (Ledger->Modifiers->Speed of Integration)"
 location_integration_gain_modifiers_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_modifiers').GetValue|2W]x Modifiers#! (Ledger->Modifiers->Speed of Integration)"
