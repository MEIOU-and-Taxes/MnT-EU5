 MNT_RGO_BASE_BEESWAX: "$MNT_RGO_SIZE_FARMING$\n| + $MNT_RGO_SIZE_BEESWAX$"
 MNT_RGO_BASE_IDEAL_BEESWAX: "$MNT_RGO_BASE_BEESWAX$\n| + $MNT_IDEAL_AREA_LOCAL_SIZE_MODIFIER$\n| + $MNT_IDEAL_AREA_SIZE_MODIFIER$"
