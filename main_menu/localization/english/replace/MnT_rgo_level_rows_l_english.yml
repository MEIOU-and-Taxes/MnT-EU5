l_english:

 #Max RGO level breakdown rows shown in the building GUI.
 #The base row's label spells out its own arithmetic; every row below it is a percentage of the number that row shows.
 #The base line goes missing in some views but not others; it is not the label text, which renders identically either way.

 MNT_RGO_BASE_SIZE: "[ShowModifierTypeName('mnt_rgo_base_size')] ([ROOT.GetLocation.GetModifierValue('mnt_rgo_base_size')])"
 MNT_RGO_BASE_MINING_SIZE: "[ShowModifierTypeName('mnt_rgo_mining_size')] ([ROOT.GetLocation.GetModifierValue('mnt_rgo_mining_size')])"
 MNT_IDEAL_AREA_LOCAL_SIZE_MODIFIER: "[ShowModifierTypeName('local_raw_material_output')] ([ROOT.GetLocation.GetModifierValue('local_raw_material_output')])"
 MNT_IDEAL_AREA_SIZE_MODIFIER: "[ShowModifierTypeName('global_raw_material_output')] ([ROOT.GetLocation.GetOwner.GetModifierValue('global_raw_material_output')])"
 MNT_RGO_BASE_MINING: "$MNT_RGO_BASE_SIZE$\n| + $MNT_RGO_BASE_MINING_SIZE$"
 MNT_RGO_BASE_IDEAL: "$MNT_RGO_BASE_SIZE$\n| + $MNT_IDEAL_AREA_LOCAL_SIZE_MODIFIER$\n| + $MNT_IDEAL_AREA_SIZE_MODIFIER$"
 MNT_RGO_BASE_MINING_IDEAL: "$MNT_RGO_BASE_SIZE$\n| + $MNT_RGO_BASE_MINING_SIZE$\n| + $MNT_IDEAL_AREA_LOCAL_SIZE_MODIFIER$\n| + $MNT_IDEAL_AREA_SIZE_MODIFIER$"

 #Size modifier rows, each a percentage of the base row above.
 LOCAL_MAX_RGO: "[ShowModifierTypeName('local_max_rgo_size_modifier')] ([ROOT.GetLocation.GetModifierValue('local_max_rgo_size_modifier')])"
 GLOBAL_MAX_RGO: "[ShowModifierTypeName('global_max_rgo_size_modifier')] ([ROOT.GetLocation.GetOwner.GetModifierValue('global_max_rgo_size_modifier')])"
 URBAN_MAX_RGO: "[ShowModifierTypeName('global_max_rgo_size_modifier_in_non_rural')] ([ROOT.GetLocation.GetOwner.GetModifierValue('global_max_rgo_size_modifier_in_non_rural')])"
 RURAL_MAX_RGO: "[ShowModifierTypeName('global_max_rgo_size_modifier_in_rural')] ([ROOT.GetLocation.GetOwner.GetModifierValue('global_max_rgo_size_modifier_in_rural')])"
