l_english:
 LOCATION_INTEGRATION_TT_TEXT: "Integration progress is [Location.GetIntegrationProgressFloat|2W]% +[Location.MakeScope.GetVariable('location_integration_gain').GetValue|3W]%/Month\nEstimate: [Location.MakeScope.GetVariable('location_integration_gain_estimate').GetValue|1W] Years\n\n[Location.Custom('location_integration_gain_base_colored')]\n[Location.Custom('location_integration_gain_proximity_colored')]\n[Location.Custom('location_integration_gain_culture_colored')]\n[Location.Custom('location_integration_gain_religion_colored')]\n[Location.Custom('location_integration_gain_modifiers_colored')]\n[Location.Custom('location_integration_gain_tech_colored')]"

 location_integration_gain_base_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_base').GetValue|2W]% Base#!"
 location_integration_gain_base_yellow: "#Y [Location.MakeScope.GetVariable('location_integration_gain_base').GetValue|2W]% Base#!"
 location_integration_gain_base_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_base').GetValue|2W]% Base#!"

 location_integration_gain_proximity_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_proximity').GetValue|2W]x Proximity#! (Min 0.75x)"
 location_integration_gain_proximity_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_proximity').GetValue|2W]x Proximity#! (Min 0.75x)"

 location_integration_gain_culture_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_culture').GetValue|2W]x Cultural Opinion#! (Max 1.18x)"
 location_integration_gain_culture_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_culture').GetValue|2W]x Cultural Opinion#! (Max 1.18x)"

 location_integration_gain_religion_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_religion').GetValue|2W]x Religious Tolerance#! (Max 1.18x)"
 location_integration_gain_religion_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_religion').GetValue|2W]x Religious Tolerance#! (Max 1.18x)"

 location_integration_gain_modifiers_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_modifiers').GetValue|2W]x Modifiers#! (Ledger->Modifiers->Speed of Integration)"
 location_integration_gain_modifiers_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_modifiers').GetValue|2W]x Modifiers#! (Ledger->Modifiers->Speed of Integration)"

 location_integration_gain_tech_green: "#G [Location.MakeScope.GetVariable('location_integration_gain_tech').GetValue|0W]x Area tech#!"
 location_integration_gain_tech_red: "#R [Location.MakeScope.GetVariable('location_integration_gain_tech').GetValue|2W]x Area tech#! (Unlock the Area-Tech for 3x)"