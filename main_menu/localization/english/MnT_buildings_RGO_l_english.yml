 # Targeted RGO production improvements
 PM_MNT_RGO_tea_coordinated: "Tea Processing"
 PM_MNT_RGO_tea_coordinated_desc: "Freshly gathered leaves must be prepared before they lose their quality. Well-equipped workshops and a steady supply of firewood allow us to bring more $tea$ to market."
 PM_MNT_RGO_tea_nurseries: "Tea Nurseries"
 PM_MNT_RGO_tea_nurseries_desc: "Healthy young plants are the foundation of a thriving tea garden. By raising seedlings in nurseries and replacing worn-out bushes, we can obtain a more plentiful harvest of $tea$."
 PM_MNT_RGO_coffee_managed: "Coffee Cultivation"
 PM_MNT_RGO_coffee_managed_desc: "Careful planting and regular tending allow coffee trees to flourish. With suitable $tools$, our growers can maintain their gardens and gather more $coffee$."
 PM_MNT_RGO_coffee_nurseries: "Coffee Nurseries"
 PM_MNT_RGO_coffee_nurseries_desc: "Nurseries provide a steady supply of young coffee trees to replace those that no longer bear well. Renewing our plantations in this way will increase the harvest of $coffee$."
 PM_MNT_RGO_cocoa_managed: "Shade Cultivation"
 PM_MNT_RGO_cocoa_managed_desc: "Cocoa trees thrive with shelter from harsh sunlight and drying winds. Careful spacing, watering and tending of the shade trees will help our gardens produce more $cocoa$."
 PM_MNT_RGO_cocoa_protected_drying: "Protected Cocoa Drying"
 PM_MNT_RGO_cocoa_protected_drying_desc: "A fine cocoa harvest can be spoiled by a sudden shower. Wooden drying trays and sheltered storage help our growers preserve more beans for sale."
 PM_MNT_RGO_alum_leached: "Alum Leaching"
 PM_MNT_RGO_alum_leached_desc: "By washing the prepared mineral and boiling down the resulting liquor, we can recover crystals of $alum$. Proper equipment and ample firewood make this work more productive."
 PM_MNT_RGO_alum_integrated_wood: "Alum Works (Wood)"
 PM_MNT_RGO_alum_integrated_wood_desc: "Bringing extraction, boiling and crystallization together allows us to produce $alum$ on a greater scale. These works require well-maintained equipment and a steady supply of firewood."
 PM_MNT_RGO_alum_integrated_coal: "Alum Works (Coal)"
 PM_MNT_RGO_alum_integrated_coal_desc: "Coal provides the heat needed to boil large quantities of alum liquor. With extraction and crystallization organized in the same works, we can supply more $alum$ to our industries."
 PM_MNT_RGO_horses_managed_wheat: "Stud Breeding (Wheat)"
 PM_MNT_RGO_horses_managed_wheat_desc: "Careful selection of breeding stock and attentive care produce healthy $horses$. Supplementary feed of $wheat$ and $legumes$ helps our studs supply more animals for farm, road and battlefield."
 PM_MNT_RGO_horses_managed_millet: "Stud Breeding (Millet)"
 PM_MNT_RGO_horses_managed_millet_desc: "Careful selection of breeding stock and attentive care produce healthy $horses$. Supplementary feed of $millet$ and $legumes$ helps our studs supply more animals for farm, road and battlefield."
 PM_MNT_RGO_horses_managed_rice: "Stud Breeding (Rice)"
 PM_MNT_RGO_horses_managed_rice_desc: "Careful selection of breeding stock and attentive care produce healthy $horses$. Supplementary feed of $rice$ and $legumes$ helps our studs supply more animals for farm, road and battlefield."
 PM_MNT_RGO_horses_managed_maize: "Stud Breeding (Maize)"
 PM_MNT_RGO_horses_managed_maize_desc: "Careful selection of breeding stock and attentive care produce healthy $horses$. Supplementary feed of $maize$ and $legumes$ helps our studs supply more animals for farm, road and battlefield."
 PM_MNT_RGO_camels_supplemented: "Camel Husbandry"
 PM_MNT_RGO_camels_supplemented_desc: "Grazing alone does not always keep a herd in good condition. Supplementing it with $wheat$ and $legumes$ allows our herders to raise more $camels$ fit for the demands of caravan travel."
 PM_MNT_RGO_sand_poor_washed: "Sand Washing (Poor Deposits)"
 PM_MNT_RGO_sand_poor_washed_desc: "Poor sand contains much that is of little use to our craftsmen. Washing away fine dirt and screening out coarse fragments allows us to recover more usable $sand$."
 PM_MNT_RGO_sand_washed: "Sand Washing"
 PM_MNT_RGO_sand_washed_desc: "Even good sand benefits from careful preparation. Washing and screening provide a cleaner, more even material for our glassmakers and other craftsmen."

 # Food-producing RGO improvements
 PM_MNT_RGO_wheat_rotation: "Cereal and Legume Rotation"
 PM_MNT_RGO_wheat_rotation_desc: "Sowing $legumes$ between crops of $wheat$ helps preserve the fertility of our fields and provides a better harvest in the following season."
 PM_MNT_RGO_wheat_drainage: "Improved Drainage"
 PM_MNT_RGO_wheat_drainage_desc: "Timber-lined drains carry standing water away from our fields, allowing teams of draft animals to plough more land before sowing."
 PM_MNT_RGO_wheat_drilled_husbandry: "Drilled Rotational Husbandry"
 PM_MNT_RGO_wheat_drilled_husbandry_desc: "By sowing $wheat$ in even rows, our farmers can weed between the plants and make better use of their seed. Alternating grain with $legumes$ helps keep the land productive."
 PM_MNT_RGO_rice_transplanted: "Nursery Transplanting"
 PM_MNT_RGO_rice_transplanted_desc: "Raising seedlings in nursery beds gives the young plants a head start. Once the paddies are prepared, the seedlings can be transplanted at regular intervals for a fuller harvest of $rice$."
 PM_MNT_RGO_rice_irrigated: "Managed Irrigation"
 PM_MNT_RGO_rice_irrigated_desc: "With timber sluices and channels lined with $masonry$, our growers can admit water to the paddies when it is needed and drain it away before the harvest."
 PM_MNT_RGO_millet_rotation: "Rotational Cultivation"
 PM_MNT_RGO_millet_rotation_desc: "By planting $legumes$ in alternate seasons, our farmers can keep the soil fertile and gather more $millet$ from the same fields."
 PM_MNT_RGO_millet_improved_tillage: "Animal-Drawn Tillage"
 PM_MNT_RGO_millet_improved_tillage_desc: "Draft animals and improved ploughs break up hard ground before sowing, giving our $millet$ a better chance to take root."
 PM_MNT_RGO_maize_mixed_cultivation: "Mixed Maize and Legume Cultivation"
 PM_MNT_RGO_maize_mixed_cultivation_desc: "Our farmers sow $legumes$ among the rows of $maize$, making good use of the ground between the tall stalks."
 PM_MNT_RGO_maize_improved_tillage: "Improved Field Cultivation"
 PM_MNT_RGO_maize_improved_tillage_desc: "Working the soil with animal-drawn implements lets our farmers prepare larger fields and plant more $maize$ in the time available for sowing."
 PM_MNT_RGO_legumes_managed_sowing: "Careful Seed Sowing"
 PM_MNT_RGO_legumes_managed_sowing_desc: "Well-spaced rows make it easier to weed around young plants. With simple $tools$ and wooden supports, our growers can tend more $legumes$ through to harvest."
 PM_MNT_RGO_legumes_improved_husbandry: "Improved Field Husbandry"
 PM_MNT_RGO_legumes_improved_husbandry_desc: "Teams of draft animals prepare the ground for sowing, allowing our growers to raise $legumes$ over a greater stretch of arable land."
 PM_MNT_RGO_potato_raised_beds: "Raised-Bed Cultivation"
 PM_MNT_RGO_potato_raised_beds_desc: "Our growers plant $potato$ in raised beds and use $stone$ to shore up the drains. Keeping the ground from becoming waterlogged helps the crop thrive."
 PM_MNT_RGO_potato_ridged: "Animal-Drawn Ridging"
 PM_MNT_RGO_potato_ridged_desc: "An animal-drawn plough raises long ridges of loose earth, giving tubers room to grow and making them easier to lift at harvest."
 PM_MNT_RGO_livestock_winter_fodder: "Winter Fodder"
 PM_MNT_RGO_livestock_winter_fodder_desc: "Stored $legumes$ keep our breeding stock fed when the pastures are bare. More animals survive the winter in good condition, leaving our herders with larger herds in spring."
 PM_MNT_RGO_livestock_pasture_breeding: "Improved Pasture and Breeding"
 PM_MNT_RGO_livestock_pasture_breeding_desc: "Our herders select the strongest animals for breeding and supplement their grazing with $wheat$ and $legumes$. A better-fed herd yields more $livestock$ for market."
 PM_MNT_RGO_fish_improved_nets: "Improved Nets and Boats"
 PM_MNT_RGO_fish_improved_nets_desc: "Sturdier boats and nets woven from $fiber_crops$ allow our crews to bring in larger catches. A supply of $salt$ preserves the $fish$ for sale."
 PM_MNT_RGO_fish_equipped_fleets: "Equipped Fishing Fleets"
 PM_MNT_RGO_fish_equipped_fleets_desc: "With sound hulls, ample sailcloth, and $salt$ to preserve the catch, our fishing vessels can range farther from shore and bring more $fish$ to market."
 PM_MNT_RGO_fruit_grafted_orchards: "Grafted Orchards"
 PM_MNT_RGO_fruit_grafted_orchards_desc: "Our orchard keepers graft branches from their best-bearing trees onto hardy stock. Careful pruning and wooden stakes help the young trees yield more $fruit$."
 PM_MNT_RGO_fruit_intensive_orchards: "Intensive Orchard Cultivation"
 PM_MNT_RGO_fruit_intensive_orchards_desc: "By tending their trees regularly and watering them from timber and stone channels, our orchard keepers can gather more $fruit$ even in dry seasons."
 PM_MNT_RGO_olives_managed_groves: "Grafting and Pruning"
 PM_MNT_RGO_olives_managed_groves_desc: "Grafting the best-bearing branches and pruning away old wood keeps our groves productive and improves the harvest of $olives$."
 PM_MNT_RGO_olives_irrigated_groves: "Improved Grove Irrigation"
 PM_MNT_RGO_olives_irrigated_groves_desc: "Timber sluices and stone channels carry water to the roots of our olive trees, helping the groves bear well through the driest months."
 PM_MNT_RGO_beeswax_wooden_hives: "Wooden Hives"
 PM_MNT_RGO_beeswax_wooden_hives_desc: "Well-made wooden hives shelter our colonies and give beekeepers better access to the comb when gathering $beeswax$."
 PM_MNT_RGO_beeswax_managed_apiaries: "Improved Apiaries"
 PM_MNT_RGO_beeswax_managed_apiaries_desc: "With sound hives, proper $tools$, and $cloth$ to protect them while working, our beekeepers can tend more colonies and gather more $beeswax$."
 PM_MNT_RGO_wild_game_managed_hunting: "Managed Hunting Grounds"
 PM_MNT_RGO_wild_game_managed_hunting_desc: "Our gamekeepers use $wheat$ to feed game when forage is scarce. Well-tended hunting grounds can support a steadier supply of $wild_game$."
 PM_MNT_RGO_wild_game_equipped_hunting: "Equipped Hunting Parties"
 PM_MNT_RGO_wild_game_equipped_hunting_desc: "With $firearms$, sound equipment, and clothing fit for the weather, our hunters can spend longer in the field and bring back more $wild_game$."
 PM_MNT_RGO_fur_improved_trapping: "Improved Trapping"
 PM_MNT_RGO_fur_improved_trapping_desc: "Sturdier traps and better $tools$ let our trappers tend more lines and recover more pelts in good condition."
 PM_MNT_RGO_fur_equipped_trapping: "Equipped Trapping Expeditions"
 PM_MNT_RGO_fur_equipped_trapping_desc: "With warm clothing, $tools$, and $firearms$, our trappers can stay in the wilderness longer and bring home more $fur$."

 STATIC_MODIFIER_NAME_mnt_food_starvation_severity: "Food Shortage Severity"
 STATIC_MODIFIER_DESC_mnt_food_starvation_severity: "Starvation penalties scale with the province's local food shortfall relative to consumption. They apply only with empty food reserves and confirmed starvation. The severity estimate excludes market deliveries and updates monthly."
