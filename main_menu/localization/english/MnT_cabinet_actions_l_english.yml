l_english:
 # Patronize the Guilds
 patronize_guilds:0 "Patronize the Guilds"
 patronize_guilds_desc:0 "Assign a minister to the guilds of a province. For as long as the assignment lasts, its workshops and manufactories produce more."
 patronize_guilds_active:0 "Patronizing the Guilds of [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 patronize_guilds_action:0 "Patronize the Guilds of [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 patronize_guilds_action_progress:0 ""
 patronize_guilds_action_progress_wordier:0 ""
 patronize_guilds_action_progress_tooltip:0 ""
 patronize_guilds_select_province:0 "Select the [province|e] whose guilds to patronize:"
 patronize_guilds_no_provinces:0 "$NO_POSSIBLE_PROVINCES$"

 # Oversee Construction
 oversee_construction:0 "Oversee Construction"
 oversee_construction_desc:0 "Assign a minister to the building works of a province. For as long as the assignment lasts, buildings, RGO upgrades and roads are raised faster in every location of the province."
 oversee_construction_active:0 "Overseeing Construction in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oversee_construction_action:0 "Oversee Construction in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oversee_construction_action_progress:0 ""
 oversee_construction_action_progress_wordier:0 ""
 oversee_construction_action_progress_tooltip:0 ""
 oversee_construction_select_province:0 "Select the [province|e] whose works to oversee:"
 oversee_construction_no_provinces:0 "$NO_POSSIBLE_PROVINCES$"

 # Appoint an Inspector of Manufactories
 appoint_inspector_of_manufactures:0 "Appoint an Inspector of Manufactories"
 appoint_inspector_of_manufactures_desc:0 "Send an inspector to a city that is already a centre of production. For five years he keeps the registers, enforces the standards and reports on the trade; when he leaves, the city keeps an Office of Manufactories for its leading industry."
 appoint_inspector_of_manufactures_active:0 "Inspecting the Manufactories of [SCOPE.sLocation('target').GetName]"
 appoint_inspector_of_manufactures_action:0 "Appoint an Inspector in [SCOPE.sLocation('target').GetNameWithNoTooltip]"
 appoint_inspector_of_manufactures_action_progress:0 "[SCOPE.sCabinet('cabinet').GetActionNumProgress|%]"
 appoint_inspector_of_manufactures_action_progress_wordier:0 "Inspection at [SCOPE.sCabinet('cabinet').GetActionNumProgress|%]"
 appoint_inspector_of_manufactures_action_progress_tooltip:0 "The inspector is at work in [SCOPE.sLocation('target').GetName]: #W [SCOPE.sCabinet('cabinet').GetActionNumProgress|%]#!\nShould be done in [SCOPE.sCabinet('cabinet').GetDaysUntilFullyImplementedInDays], on [SCOPE.sCabinet('cabinet').GetFullyImplementedDateString]"
 appoint_inspector_select_location:0 "Select the [location|e] for the inspector:"
 appoint_inspector_no_locations:0 "$NO_POSSIBLE_LOCATIONS$"

 # Elevate the Office of Manufactories
 elevate_office_of_manufactories:0 "Elevate the Office of Manufactories"
 elevate_office_of_manufactories_desc:0 "Raise an existing office to a Board of Manufactories. Only a city whose production centre has been promoted to regional or higher can support a board."
 elevate_office_of_manufactories_active:0 "Elevating the Office of Manufactories in [SCOPE.sLocation('target').GetName]"
 elevate_office_of_manufactories_action:0 "Elevate the Office in [SCOPE.sLocation('target').GetNameWithNoTooltip]"
 elevate_office_of_manufactories_action_progress:0 "[SCOPE.sCabinet('cabinet').GetActionNumProgress|%]"
 elevate_office_of_manufactories_action_progress_wordier:0 "Elevation at [SCOPE.sCabinet('cabinet').GetActionNumProgress|%]"
 elevate_office_of_manufactories_action_progress_tooltip:0 "The office is being raised to a board: #W [SCOPE.sCabinet('cabinet').GetActionNumProgress|%]#!\nShould be done in [SCOPE.sCabinet('cabinet').GetDaysUntilFullyImplementedInDays], on [SCOPE.sCabinet('cabinet').GetFullyImplementedDateString]"
 elevate_office_select_location:0 "Select the [location|e] whose office to elevate:"
 elevate_office_no_locations:0 "$NO_POSSIBLE_LOCATIONS$"
