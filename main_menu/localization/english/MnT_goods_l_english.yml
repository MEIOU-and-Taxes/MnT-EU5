 mnt_credit_loan_demand_desc: "[Market.GetName] supplies [ShowGoodsName('credit')] to countries with outstanding [loans|e] whose capitals are in this [market|e]. The table shows each borrower's debt and monthly [ShowGoodsName('credit')] demand.\n\nEvery 1,000 of outstanding debt requires 1 [ShowGoodsName('credit')] per month. This falls to 0.9 with [ShowAdvanceName('banking_advance')], 0.8 with [ShowAdvanceName('basic_financial_instruments')], 0.7 with [ShowAdvanceName('global_trade_advance')], 0.6 with [ShowAdvanceName('stock_exchange_advance')], and 0.5 with [ShowAdvanceName('clearing_house_advance')]."
