 sand: "Quartz Sand"
 sand_desc: "High-quality silica sand is valued not for its abundance, but for its purity and specific properties. Its primary uses in pre-modern times were in the production of clear glass, as a fluxing agent in metallurgy to help separate impurities from molten metal, and for various other applications that required a consistent, silica-rich material rather than common, impure sand."
 metalwork_guild_maintenance: "Blacksmiths"
 crude_metalwork_guild_maintenance: "Crude Blacksmiths"
 PM_RGO_iron_normal_desc: "Equipped with forged [ShowGoodsName('tools')] and stoked with [ShowGoodsName('coal')], bloomery furnaces extract far more [ShowGoodsName('iron')] from deeper seams."
 PM_RGO_iron_lumber: "Charcoal Bloomeries"
 PM_RGO_iron_lumber_desc: "Forged [ShowGoodsName('tools')] and charcoal burned from local [ShowGoodsName('lumber')] sustain bloomery smelting where [ShowGoodsName('coal')] is scarce."
 PM_RGO_iron_blast_furnace: "Coal Blast Furnaces"
 PM_RGO_iron_blast_furnace_desc: "Water-powered bellows and tall [ShowGoodsName('coal')]-fired blast furnaces smelt continuous flows of pig [ShowGoodsName('iron')] at much higher yields."
 PM_RGO_iron_blast_furnace_lumber: "Charcoal Blast Furnaces"
 PM_RGO_iron_blast_furnace_lumber_desc: "Tall blast furnaces fueled by abundant charcoal from [ShowGoodsName('lumber')] smelt large quantities of pig [ShowGoodsName('iron')] without relying on [ShowGoodsName('coal')]."
 PM_RGO_iron_coke_blast_furnace: "Coke Blast Furnaces"
 PM_RGO_iron_coke_blast_furnace_desc: "Refining [ShowGoodsName('coal')] into coke removes impurities and allows high-temperature blast furnaces to maximize [ShowGoodsName('iron')] output."
 PM_RGO_iron_coke_blast_furnace_lumber: "Industrial Charcoal Furnaces"
 PM_RGO_iron_coke_blast_furnace_lumber_desc: "High-capacity blast furnaces adapted to intensive charcoal burning from [ShowGoodsName('lumber')] rival coke smelting in heavily forested regions."
 diffuse_iron_extraction: "Coal Bog Iron Smelting"
 diffuse_iron_extraction_desc: "Low-grade ore gathered from marshes, lakes, and hillsides is smelted with [ShowGoodsName('coal')] to supply modest amounts of [ShowGoodsName('iron')]."
 diffuse_iron_extraction_lumber: "Charcoal Bog Iron Smelting"
 diffuse_iron_extraction_lumber_desc: "Low-grade ore gathered from marshes, lakes, and hillsides is smelted with charcoal from [ShowGoodsName('lumber')] where mined [ShowGoodsName('iron')] is unavailable."
 diffuse_iron_blast_extraction: "Coal Bog Iron Blast Furnaces"
 diffuse_iron_blast_extraction_desc: "Small blast furnaces stoked with [ShowGoodsName('coal')] draw higher [ShowGoodsName('iron')] yields from marginal bog and surface deposits."
 diffuse_iron_blast_extraction_lumber: "Charcoal Bog Iron Blast Furnaces"
 diffuse_iron_blast_extraction_lumber_desc: "Small blast furnaces fueled by [ShowGoodsName('lumber')] charcoal draw higher [ShowGoodsName('iron')] yields from marginal bog and surface deposits."
 diffuse_iron_extraction_coke_blast: "Coke Bog Iron Blast Furnaces"
 diffuse_iron_extraction_coke_blast_desc: "Coke-fired furnaces push marginal ore deposits to their maximum practical [ShowGoodsName('iron')] output."
 diffuse_iron_extraction_coke_blast_lumber: "Industrial Charcoal Bog Iron Furnaces"
 diffuse_iron_extraction_coke_blast_lumber_desc: "High-capacity charcoal furnaces fueled by [ShowGoodsName('lumber')] push marginal ore deposits to their maximum practical [ShowGoodsName('iron')] output."
 russian_enhanced_bog_iron_lumber: "Rus Bog Iron Smelting"
 russian_enhanced_bog_iron_lumber_desc: "Centuries of experience gathering and smelting bog ore with local [ShowGoodsName('lumber')] allow Rus smelters to extract far more [ShowGoodsName('iron')]."
 mnt_glass_guild_maintenance: "Glass Guilds"
