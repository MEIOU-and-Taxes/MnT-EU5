 sand_desc: "High-quality silica sand is valued not for its abundance, but for its purity and specific properties. Its primary uses in pre-modern times were in the production of clear glass, as a fluxing agent in metallurgy to help separate impurities from molten metal, and for various other applications that required a consistent, silica-rich material rather than common, impure sand."
