l_english:
 credit: "Credit"
 credit_desc: "Credit represents access to loans, bills of exchange, deposits, and merchant advances.\n\n$BULLET_WITH_TAB$ #bold Supply#! comes from banks, merchants' guilds, and local institutions. Local [peasant_enfranchisement|e] lowers output below 50% and raises it above 50%. Credit can be stockpiled and traded between [markets|e].\n$BULLET_WITH_TAB$ #bold Loans#! draw Credit from the borrower's capital market while they are outstanding. Scarce Credit raises [interest|e] on [loans|e].\n$BULLET_WITH_TAB$ #bold Buildings and households#! create demand for [ShowGoodsName('credit')] in their [market|e]. Some [buildings|e] use Credit to finance extra goods output, and others use it for maintenance.\n$BULLET_WITH_TAB$ #bold Burgher trade#! creates monthly demand of 1 Credit per 1,000 Burgher Trade Capacity. Cheap Credit can expand [burgher_trade|e] capacity by up to 300%, and expensive Credit can reduce it by up to 70%."
